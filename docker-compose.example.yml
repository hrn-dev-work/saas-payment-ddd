# Copy to docker-compose.yml and adjust passwords / ports.
# Local PostgreSQL runs HERE (not as a Windows/WSL system service).
# Docs: docs/en/local-database.md · docs/ja/local-database.md

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional later:
  # api:
  #   build: ./backend
  #   ports: ["8000:8000"]
  #   env_file: [.env]
  #   depends_on:
  #     db:
  #       condition: service_healthy
  # web:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   env_file: [.env]

volumes:
  pgdata:
